<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Assinaturas Multsoft</title>
  <style>
    :root {
      --bg: #101319;
      --panel: #171b22;
      --panel-2: #202631;
      --text: #f5f7fb;
      --muted: #aab4c1;
      --line: #2f3744;
      --green: #6aa84f;
      --signature-green: #79c35a;
      --cyan: #08c9ed;
      --white: #ffffff;
      --danger: #ef6b6b;
      color-scheme: dark;
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1016;
      color: var(--text);
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }

    .workspace {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #dce3ec;
      font-size: 13px;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #3a4351;
      border-radius: 8px;
      background: #10141b;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      padding: 11px 12px;
      outline: none;
    }

    input[type="file"] {
      padding: 9px;
      color: var(--muted);
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .section-label {
      margin: 6px 0 -4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(8, 201, 237, 0.15);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #0b1309;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #3a4351;
    }

    button.full {
      grid-column: 1 / -1;
    }

    button:hover {
      filter: brightness(1.07);
    }

    .status {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .signature-shell {
      width: min(100%, 980px);
    }

    .signature-frame {
      width: 100%;
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    #signatureSvg {
      display: block;
      width: 720px;
      height: 180px;
      max-width: none;
    }

    .copy-buffer {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 720px;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace {
        justify-content: flex-start;
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <aside class="sidebar">
      <h1>Gerador de Assinaturas</h1>
      <p class="intro">Edite os dados, confira o preview e exporte a assinatura no padrão visual da Multsoft.</p>

      <form id="signatureForm">
        <label>
          Nome
          <input id="name" value="" placeholder="Ex.: Nome Sobrenome" autocomplete="name">
        </label>

        <label>
          Cargo / setor
          <input id="role" value="" placeholder="Ex.: Administrativo / Financeiro">
        </label>

        <label>
          Telefone
          <input id="phone" value="" placeholder="Ex.: +55 61 3686-2600">
        </label>

        <label>
          WhatsApp
          <input id="whatsapp" value="" placeholder="Ex.: +55 61 99999-9999">
        </label>

        <label>
          E-mail
          <input id="email" value="" placeholder="Ex.: nome@empresa.com.br" autocomplete="email">
        </label>

        <label>
          Endereço
          <textarea id="address" placeholder="Ex.: Rua, número - Bairro, Cidade - UF, CEP"></textarea>
        </label>

        <label>
          URL base das logos (hospedagem pública)
          <input id="assetsBaseUrl" placeholder="https://seusite.com.br/assinaturas" autocomplete="off">
        </label>
        <p class="section-label" style="text-transform:none;font-weight:600;color:var(--muted);margin-top:-8px;">
          Deixe em branco se o gerador estiver publicado na internet — as imagens são detectadas automaticamente. Preencha apenas se hospedar as imagens em outro endereço.
        </p>

        <p class="section-label">Marca alternativa</p>

        <label>
          Imagem
          <input id="brandImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
        </label>

        <div class="field-row">
          <label>
            X
            <input id="brandX" type="number" value="482" min="430" max="690" step="1">
          </label>
          <label>
            Y
            <input id="brandY" type="number" value="37" min="0" max="150" step="1">
          </label>
          <label>
            Largura
            <input id="brandWidth" type="number" value="210" min="80" max="270" step="1">
          </label>
        </div>

        <div class="actions">
          <button type="button" id="downloadPng">Baixar PNG transparente</button>
          <button type="button" id="copyHtml" class="secondary">Copiar HTML</button>
          <button type="button" id="resetBrand" class="secondary full">Usar logo padrão</button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </aside>

    <section class="workspace" aria-label="Preview da assinatura">
      <div class="signature-shell">
        <div class="signature-frame">
          <svg id="signatureSvg" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Assinatura Multsoft">
            <defs>
              <clipPath id="signatureClip">
                <rect width="720" height="180"></rect>
              </clipPath>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.38"></feDropShadow>
              </filter>
            </defs>

            <g clip-path="url(#signatureClip)">
              <rect id="signatureBackground" width="720" height="180" fill="transparent"></rect>

              <line x1="324" y1="32" x2="324" y2="149" stroke="#dfe3ea" stroke-width="1.4"></line>
              <line x1="472" y1="32" x2="472" y2="149" stroke="#dfe3ea" stroke-width="1.4"></line>
              <rect x="338" y="47" width="4" height="64" rx="2" fill="#0a7c93"></rect>

              <g stroke="#2f7d1f" stroke-width="6" stroke-linecap="round">
                <line x1="15" y1="41" x2="15" y2="72"></line>
                <line x1="16" y1="110" x2="16" y2="159"></line>
              </g>
              <g stroke="#0a7c93" stroke-width="6" stroke-linecap="round">
                <line x1="15" y1="41" x2="15" y2="72"></line>
              </g>
              <circle cx="3" cy="106" r="3" fill="#2f7d1f"></circle>

              <g>
                <text id="svgName" x="37" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#1f6b12">Winne Rafaella Pacheco</text>
                <text id="svgRole" x="37" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0a7c93">Administrativo / Financeiro / DP</text>
              </g>

              <g font-family="Segoe UI, Arial, sans-serif" font-weight="750" font-size="13.5" fill="#333333">
                <g transform="translate(37 98) scale(0.62)" fill="none" stroke="#2f7d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </g>
                <text id="svgPhone" x="63" y="111">+55 61 3686-2600</text>
                <g transform="translate(37 123) scale(0.62)" fill="none" stroke="#2f7d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </g>
                <text id="svgEmail" x="63" y="136">winne.pacheco@multbovinos.corp.br</text>
                <g transform="translate(37 147) scale(0.62)" fill="none" stroke="#2f7d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </g>
                <text id="svgAddress" x="63" y="160" font-size="10.8">Rua 89, 225 - St. Sul, Goiânia - GO, 74093-140</text>
              </g>

              <g fill="#0a7c93" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800">
                <text x="353" y="64">Gestão Pecuária</text>
                <text x="353" y="84">Descomplicada</text>
                <text x="353" y="104">da sua Fazenda</text>
              </g>

              <g id="defaultBrandGroup">
                <image id="defaultMultsoftImage" x="495" y="39" width="188" height="31" preserveAspectRatio="xMidYMid meet"></image>
                <image id="defaultProductImage" x="496" y="86" width="186" height="30" preserveAspectRatio="xMidYMid meet"></image>
                <rect x="497" y="138" width="178" height="23" rx="11.5" fill="#ffffff"></rect>
                <rect x="499" y="140" width="174" height="19" rx="9.5" fill="#ffffff" stroke="#6aa84f" stroke-width="1.2"></rect>
                <text x="586" y="153.5" text-anchor="middle" fill="#5c7f3f" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">www.multsoft.agr.br</text>
              </g>
              <image id="customBrandImage" x="482" y="37" width="210" height="112" preserveAspectRatio="xMidYMid meet" style="display:none"></image>
            </g>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <div id="copyBuffer" class="copy-buffer" aria-hidden="true"></div>

  <script src="assets/logos.js"></script>
  <script>
    const fields = {
      name: document.querySelector('#name'),
      role: document.querySelector('#role'),
      phone: document.querySelector('#phone'),
      whatsapp: document.querySelector('#whatsapp'),
      email: document.querySelector('#email'),
      address: document.querySelector('#address'),
      assetsBaseUrl: document.querySelector('#assetsBaseUrl'),
      brandX: document.querySelector('#brandX'),
      brandY: document.querySelector('#brandY'),
      brandWidth: document.querySelector('#brandWidth')
    };

    const svgTargets = {
      name: document.querySelector('#svgName'),
      role: document.querySelector('#svgRole'),
      phone: document.querySelector('#svgPhone'),
      email: document.querySelector('#svgEmail'),
      address: document.querySelector('#svgAddress')
    };

    const status = document.querySelector('#status');
    const svg = document.querySelector('#signatureSvg');
    const copyBuffer = document.querySelector('#copyBuffer');
    const signatureWidth = 720;
    const signatureHeight = 180;
    const exportWidth = 600;
    const exportHeight = 150;
    const pngScale = 2;
    const brandImageInput = document.querySelector('#brandImageInput');
    const defaultBrandGroup = document.querySelector('#defaultBrandGroup');
    const defaultMultsoftImage = document.querySelector('#defaultMultsoftImage');
    const defaultProductImage = document.querySelector('#defaultProductImage');
    const customBrandImage = document.querySelector('#customBrandImage');
    const defaultLogoData = window.defaultLogoData || {};
    let customBrandDataUrl = '';
    let customBrandAspectRatio = 210 / 112;

    const setStatus = (message, isError = false) => {
      status.textContent = message;
      status.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    };

    const normalizePhoneDigits = (value) => value.replace(/\D/g, '');
    const cleanFileName = (value) => value
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/gi, '-')
      .replace(/^-+|-+$/g, '')
      .toLowerCase() || 'assinatura';

    const fitText = (node, maxWidth, startSize, minSize) => {
      node.setAttribute('font-size', startSize);
      while (node.getComputedTextLength() > maxWidth && Number(node.getAttribute('font-size')) > minSize) {
        node.setAttribute('font-size', Number(node.getAttribute('font-size')) - 0.5);
      }
    };

    const syncBrandImage = () => {
      const width = Number(fields.brandWidth.value) || 210;
      const height = Math.max(45, width / customBrandAspectRatio);

      customBrandImage.setAttribute('x', Number(fields.brandX.value) || 482);
      customBrandImage.setAttribute('y', Number(fields.brandY.value) || 37);
      customBrandImage.setAttribute('width', width);
      customBrandImage.setAttribute('height', height);
      customBrandImage.style.display = customBrandDataUrl ? 'block' : 'none';
      defaultBrandGroup.style.display = customBrandDataUrl ? 'none' : 'block';
    };

    const syncPreview = () => {
      svgTargets.name.textContent = fields.name.value.trim() || 'Nome Sobrenome';
      svgTargets.role.textContent = fields.role.value.trim() || 'Cargo / setor';
      svgTargets.phone.textContent = fields.phone.value.trim() || '+55 00 0000-0000';
      svgTargets.email.textContent = fields.email.value.trim() || 'email@empresa.com.br';
      svgTargets.address.textContent = fields.address.value.trim() || 'Endereço';

      fitText(svgTargets.name, 270, 20, 13);
      fitText(svgTargets.role, 270, 15, 10.5);
      fitText(svgTargets.phone, 238, 13.5, 9.5);
      fitText(svgTargets.email, 248, 13.5, 9);
      fitText(svgTargets.address, 248, 10.8, 7.6);
      syncBrandImage();
    };

    const getSvgMarkup = (width = signatureWidth, height = signatureHeight) => {
      const clone = svg.cloneNode(true);
      clone.setAttribute('width', String(width));
      clone.setAttribute('height', String(height));
      clone.removeAttribute('style');
      return new XMLSerializer().serializeToString(clone);
    };

    const downloadPng = async () => {
      syncPreview();
      const outputWidth = exportWidth;
      const outputHeight = exportHeight;
      const pixelWidth = outputWidth * pngScale;
      const pixelHeight = outputHeight * pngScale;
      const svgMarkup = getSvgMarkup(pixelWidth, pixelHeight);
      const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const image = new Image();

      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
        const context = canvas.getContext('2d');
        context.clearRect(0, 0, pixelWidth, pixelHeight);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, 0, 0, pixelWidth, pixelHeight);
        URL.revokeObjectURL(url);

        const link = document.createElement('a');
        link.download = `${cleanFileName(fields.name.value)}-assinatura.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        setStatus(`PNG transparente gerado em ${pixelWidth}x${pixelHeight}px (nítido em telas retina). Exiba a 600x150px no e-mail.`);
      };

      image.onerror = () => {
        URL.revokeObjectURL(url);
        setStatus('Não foi possível gerar o PNG neste navegador.', true);
      };

      image.src = url;
    };

    const isHosted = () => location.protocol === 'http:' || location.protocol === 'https:';

    const resolveAssetUrl = (fileName, fallback) => {
      const base = (fields.assetsBaseUrl.value || '').trim().replace(/\/+$/, '');
      if (base) return `${base}/${fileName}`;
      // Publicado (http/https): usa a própria pasta assets/ do site — imagens públicas para o e-mail.
      if (isHosted()) return new URL(`assets/${fileName}`, location.href).href;
      // Aberto como arquivo local (file://): base64/relativo, só serve para o preview.
      return fallback || `assets/${fileName}`;
    };

    const createHtmlSignature = () => {
      const phoneText = fields.phone.value.trim();
      const whatsappDigits = normalizePhoneDigits(fields.whatsapp.value || fields.phone.value);
      const email = fields.email.value.trim();
      const address = fields.address.value.trim();

      const multsoftSrc = resolveAssetUrl('multsoft-wordmark.png', defaultLogoData.multsoft);
      const mbTratosSrc = resolveAssetUrl('mb-tratos-wordmark.png', defaultLogoData.mbTratos);
      const phoneIcon = resolveAssetUrl('icon-phone.png');
      const mailIcon = resolveAssetUrl('icon-mail.png');
      const pinIcon = resolveAssetUrl('icon-location.png');
      const iconStyle = 'width:16px;height:16px;vertical-align:middle;margin-right:9px;border:0;';

      const brandHtml = customBrandDataUrl
        ? `<img src="${customBrandDataUrl}" width="176" alt="Marca" style="display:block;border:0;width:176px;max-width:176px;height:auto;margin:0 auto;">`
        : `
              <img src="${multsoftSrc}" width="168" height="28" alt="Multsoft" style="display:block;border:0;width:168px;height:28px;margin:0 auto 14px;">
              <img src="${mbTratosSrc}" width="168" height="27" alt="MB Tratos" style="display:block;border:0;width:168px;height:27px;margin:0 auto 14px;">
              <a href="https://www.multsoft.agr.br" style="display:inline-block;padding:4px 16px;border-radius:12px;border:1px solid #2f7d1f;color:#2f7d1f;font-size:11px;font-weight:800;line-height:16px;text-decoration:none;">www.multsoft.agr.br</a>
            `;

      return `
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:transparent;font-family:Segoe UI,Arial,sans-serif;border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;">
          <tr>
            <td width="8" style="width:8px;border-left:5px solid #2f7d1f;font-size:0;line-height:0;">&nbsp;</td>
            <td width="247" style="width:247px;padding:22px 10px 18px 12px;vertical-align:top;">
              <div style="font-size:18px;font-weight:800;line-height:22px;color:#1f6b12;">${escapeHtml(fields.name.value.trim())}</div>
              <div style="font-size:13px;font-weight:600;line-height:18px;color:#0a7c93;margin-bottom:16px;">${escapeHtml(fields.role.value.trim())}</div>
              <div style="font-size:12.5px;font-weight:600;line-height:24px;color:#333333;"><img src="${phoneIcon}" width="16" height="16" alt="" style="${iconStyle}"><a href="tel:${normalizePhoneDigits(phoneText)}" style="color:#333333;text-decoration:none;">${escapeHtml(phoneText)}</a></div>
              <div style="font-size:12.5px;font-weight:600;line-height:24px;color:#333333;"><img src="${mailIcon}" width="16" height="16" alt="" style="${iconStyle}"><a href="mailto:${escapeHtml(email)}" style="color:#333333;text-decoration:none;">${escapeHtml(email)}</a></div>
              <div style="font-size:11px;font-weight:600;line-height:18px;color:#333333;"><img src="${pinIcon}" width="16" height="16" alt="" style="${iconStyle}">${escapeHtml(address)}</div>
            </td>
            <td width="118" style="width:118px;border-left:1px solid #dfe3ea;border-right:1px solid #dfe3ea;padding:26px 8px 0 22px;vertical-align:top;color:#0a7c93;font-size:12.5px;font-weight:800;line-height:18px;">
              Gestão Pecuária<br>Descomplicada<br>da sua Fazenda
            </td>
            <td width="215" style="width:215px;padding:24px 18px 0 18px;vertical-align:top;text-align:center;">
              ${brandHtml}
            </td>
          </tr>
        </table>
        <div style="display:none;max-height:0;overflow:hidden;"><a href="https://wa.me/${whatsappDigits}">WhatsApp</a></div>
      `;
    };

    const escapeHtml = (value) => value
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const copyHtml = async () => {
      syncPreview();
      const html = createHtmlSignature();
      copyBuffer.innerHTML = html;

      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([copyBuffer.innerText], { type: 'text/plain' })
            })
          ]);
        } else {
          const range = document.createRange();
          range.selectNodeContents(copyBuffer);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          document.execCommand('copy');
          selection.removeAllRanges();
        }
        const imagesOk = Boolean((fields.assetsBaseUrl.value || '').trim()) || isHosted();
        setStatus(imagesOk
          ? 'HTML copiado (600px, imagens públicas).'
          : 'HTML copiado, mas as imagens estão em base64 (podem não aparecer no Gmail/Outlook). Publique o gerador na internet ou informe a URL base das logos.', !imagesOk);
      } catch (error) {
        setStatus('Não consegui copiar automaticamente. Selecione o preview e copie manualmente.', true);
      }
    };

    Object.values(fields).forEach((field) => {
      field.addEventListener('input', syncPreview);
    });

    brandImageInput.addEventListener('change', () => {
      const file = brandImageInput.files && brandImageInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        customBrandDataUrl = String(reader.result || '');
        customBrandImage.setAttribute('href', customBrandDataUrl);

        const image = new Image();
        image.onload = () => {
          customBrandAspectRatio = image.naturalWidth / image.naturalHeight || customBrandAspectRatio;
          syncPreview();
          setStatus('Logo final aplicada ao preview.');
        };
        image.onerror = () => {
          customBrandAspectRatio = 210 / 112;
          syncPreview();
          setStatus('Logo final aplicada. Ajuste X, Y e largura se precisar.');
        };
        image.src = customBrandDataUrl;
      };
      reader.readAsDataURL(file);
    });

    document.querySelector('#resetBrand').addEventListener('click', () => {
      customBrandDataUrl = '';
      customBrandImage.removeAttribute('href');
      brandImageInput.value = '';
      fields.brandX.value = '482';
      fields.brandY.value = '37';
      fields.brandWidth.value = '210';
      syncPreview();
      setStatus('Logo padrão restaurada.');
    });

    if (defaultLogoData.multsoft) {
      defaultMultsoftImage.setAttribute('href', defaultLogoData.multsoft);
    } else {
      defaultMultsoftImage.setAttribute('href', 'assets/multsoft-wordmark.png');
    }

    if (defaultLogoData.mbTratos) {
      defaultProductImage.setAttribute('href', defaultLogoData.mbTratos);
    } else {
      defaultProductImage.setAttribute('href', 'assets/mb-tratos-wordmark.png');
    }

    document.querySelector('#downloadPng').addEventListener('click', downloadPng);
    document.querySelector('#copyHtml').addEventListener('click', copyHtml);

    syncPreview();
  </script>
</body>
</html>
